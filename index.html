<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박선우 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <header class="bg-gray-800 border-b border-gray-700 p-4 flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-md">
            선우
        </div>
        <div>
            <h1 class="font-bold text-lg">박선우 AI</h1>
            <p class="text-xs text-green-400">● 24시간 접속 가능</p>
        </div>
    </header>

    <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-3.5 max-w-[80%] text-sm">
                안녕! 나는 박선우 AI야. 궁금한 게 있거나 하고 싶은 말이 있다면 뭐든지 물어봐! 😊
            </div>
        </div>
    </main>

    <footer class="p-4 bg-gray-900 border-t border-gray-800">
        <form id="chatForm" class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="박선우 AI에게 메시지 보내기..." class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-3 rounded-xl font-medium text-sm transition">
                전송
            </button>
        </form>
    </footer>

    <script>
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        let conversationHistory = [];

        function appendMessage(role, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const msgBubble = document.createElement('div');
            msgBubble.className = role === 'user' 
                ? 'bg-indigo-600 text-white rounded-2xl p-3.5 max-w-[80%] text-sm'
                : 'bg-gray-800 border border-gray-700 text-gray-100 rounded-2xl p-3.5 max-w-[80%] text-sm whitespace-pre-wrap';
            
            msgBubble.textContent = text;
            wrapper.appendChild(msgBubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgBubble;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            conversationHistory.push({ role: 'user', parts: [{ text }] });
            const loadingBubble = appendMessage('model', '선우가 생각 중...');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '오류 발생');

                loadingBubble.textContent = data.reply;
                conversationHistory.push({ role: 'model', parts: [{ text: data.reply }] });

            } catch (err) {
                loadingBubble.textContent = `⚠️ 오류: ${err.message}`;
                loadingBubble.classList.add('text-red-400');
            }
        });
    </script>
</body>
</html>
