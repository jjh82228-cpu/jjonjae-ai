<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쫀재 AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[80vh] border border-slate-700">
    
    <!-- 헤더 영역 -->
    <header class="bg-indigo-600 p-4 text-center font-bold text-xl shadow-md flex items-center justify-between">
      <span>🤖 쫀재 AI</span>
      <span class="text-xs bg-indigo-800 px-2 py-1 rounded-full text-indigo-200">Online</span>
    </header>

    <!-- 채팅 대화창 영역 -->
    <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4">
      <div class="flex items-start gap-2">
        <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm shadow-md">
          안녕! 나는 쫀재 AI야. 궁금한 게 있거나 심심할 때 언제든 말 걸어줘! 😊
        </div>
      </div>
    </div>

    <!-- 입력창 영역 -->
    <form id="chat-form" class="p-4 bg-slate-800 border-t border-slate-700 flex gap-2">
      <input 
        type="text" 
        id="user-input" 
        placeholder="쫀재 AI에게 메시지 보내기..." 
        class="flex-1 bg-slate-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-slate-400 text-sm"
        required
      />
      <button 
        type="submit" 
        class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-semibold text-sm transition-all duration-200 shadow-md flex items-center justify-center"
      >
        전송
      </button>
    </form>
  </div>

  <script>
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');

    const conversationHistory = [];

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      // 사용자 메시지 화면에 추가
      appendMessage('user', message);
      conversationHistory.push({ role: 'user', parts: [{ text: message }] });
      userInput.value = '';

      // 로딩 표시 추가
      const loadingId = appendLoading();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory })
        });

        const data = await response.json();
        removeLoading(loadingId);

        if (response.ok) {
          appendMessage('ai', data.reply);
          conversationHistory.push({ role: 'model', parts: [{ text: data.reply }] });
        } else {
          appendMessage('error', data.error || '오류가 발생했습니다.');
        }
      } catch (error) {
        removeLoading(loadingId);
        appendMessage('error', 'AI 응답을 가져오는 중 오류가 발생했습니다.');
      }
    });

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = sender === 'user' ? 'flex justify-end' : 'flex items-start gap-2';

      let bgClass = 'bg-indigo-600 text-white rounded-tl-none';
      if (sender === 'user') bgClass = 'bg-indigo-500 text-white rounded-tr-none';
      if (sender === 'error') bgClass = 'bg-red-500/20 border border-red-500/50 text-red-200 rounded-tl-none';

      msgDiv.innerHTML = `
        <div class="${bgClass} p-3 rounded-2xl max-w-[80%] text-sm shadow-md whitespace-pre-wrap">
          ${text}
        </div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendLoading() {
      const id = 'loading-' + Date.now();
      const loadingDiv = document.createElement('div');
      loadingDiv.id = id;
      loadingDiv.className = 'flex items-start gap-2';
      loadingDiv.innerHTML = `
        <div class="bg-slate-700 text-slate-300 p-3 rounded-2xl rounded-tl-none text-sm animate-pulse">
          쫀재 AI가 생각하는 중...
        </div>
      `;
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeLoading(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
</body>
</html>
